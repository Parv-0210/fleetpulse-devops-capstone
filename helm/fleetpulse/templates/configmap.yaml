apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fleetpulse.fullname" . }}-config
  labels:
    {{- include "fleetpulse.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.backend.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  SEED_DEMO_DATA: {{ .Values.backend.seedDemoData | quote }}
  RUN_MIGRATIONS: "false"   # migrations run in the init container, not in every replica's entrypoint
  BACKEND_UPSTREAM: {{ printf "%s:%d" (include "fleetpulse.backend.name" .) (int .Values.backend.port) | quote }}
