{{- if .Values.monitoring.grafanaDashboard.enabled }}
# Picked up automatically by the Grafana dashboard sidecar (label grafana_dashboard=1).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fleetpulse.fullname" . }}-grafana-dashboard
  labels:
    {{- include "fleetpulse.labels" . | nindent 4 }}
    {{- with .Values.monitoring.grafanaDashboard.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
data:
  fleetpulse.json: |-
{{ .Files.Get "dashboards/fleetpulse.json" | indent 4 }}
{{- end }}
