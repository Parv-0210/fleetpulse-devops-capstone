# AWS EKS (provisioned by ./terraform). Images come from GHCR with the git SHA tag:
#   helm upgrade --install fleetpulse ./helm/fleetpulse -n fleetpulse --create-namespace \
#     -f helm/fleetpulse/values-prod.yaml --set backend.tag=$SHA --set frontend.tag=$SHA
image:
  pullPolicy: IfNotPresent

backend:
  replicaCount: 2
  seedDemoData: true
  resources:
    requests: { cpu: 150m, memory: 256Mi }
    limits: { cpu: 750m, memory: 512Mi }

frontend:
  replicaCount: 2

postgres:
  storage:
    size: 5Gi
    storageClassName: gp3

ingress:
  enabled: true
  className: nginx
  host: ""                  # empty = answer on the AWS load balancer DNS name; set a domain if you have one
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 2m

hpa:
  backend:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 60
