name: FleetPulse Security

# DevSecOps checks that run next to the main pipeline:
#   SAST   - CodeQL on the Python backend and the JavaScript frontend
#   SCA    - pip-audit (backend) and npm audit (frontend) against known-vulnerable packages
#   Secrets and IaC - Trivy scans the repository for leaked credentials and for critical
#            misconfigurations in Dockerfiles, Kubernetes/Helm manifests and Terraform
# Image scanning (Trivy) lives in ci-cd.yml because it gates the push to GHCR.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"   # every Monday: catch newly published CVEs in unchanged code
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sast-codeql:
    name: SAST · CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v4
        with:
          category: codeql-${{ matrix.language }}

  sca-backend:
    name: SCA · pip-audit (backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Audit pinned runtime dependencies
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --strict --progress-spinner off --desc on

  sca-frontend:
    name: SCA · npm audit (frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Audit dependencies (fail on high or critical)
        run: npm audit --audit-level=high

  secrets-and-iac:
    name: Secrets + IaC misconfiguration · Trivy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # scan the full history for leaked credentials, not just HEAD

      - name: Secret scan (blocking)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          exit-code: "1"
          format: table
          skip-dirs: frontend/node_modules,backend/.venv

      - name: IaC misconfiguration scan (blocking on CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL
          exit-code: "1"
          format: table
          skip-dirs: frontend/node_modules,backend/.venv,terraform/.terraform
          skip-setup-trivy: true

      - name: IaC misconfiguration report (all severities, SARIF)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: MEDIUM,HIGH,CRITICAL
          exit-code: "0"
          format: sarif
          output: trivy-iac.sarif
          skip-dirs: frontend/node_modules,backend/.venv,terraform/.terraform
          skip-setup-trivy: true

      - name: Upload IaC findings to the Security tab
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-iac.sarif
          category: trivy-iac
