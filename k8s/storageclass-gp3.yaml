# EKS only: gp3 volumes via the EBS CSI driver add-on installed by Terraform.
# Made the default class so the PostgreSQL PVC binds without extra configuration.
# (minikube already ships a default "standard" StorageClass - do not apply this there.)
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
allowVolumeExpansion: true
